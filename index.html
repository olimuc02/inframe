<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="InFrame">
<meta name="application-name" content="InFrame">
<meta name="description" content="Share event photos with friends. Everyone gets the photos they're in.">
<meta name="theme-color" content="#F3EFE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11100E" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="tab-icon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="tab-icon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="shortcut icon" href="tab-icon.ico?v=2">
<title>InFrame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* ============ InFrame design system: photo paper, ink, film orange ============ */
:root{
  --bg:#F3EFE7; --card:#FFFDF9; --card2:#EBE6DC; --ink:#161513; --ink2:#3A3733; --muted:#7D766C; --sep:rgba(22,21,19,.11);
  --accent:#FF5B24; --accent-soft:rgba(255,91,36,.13); --link:#C93F0D; --green:#1E9E5A; --red:#DC3B3F;
  --bar:rgba(243,239,231,.86); --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --shadow:0 1px 0 rgba(22,21,19,.04),0 10px 30px -12px rgba(22,21,19,.18);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#11100E; --card:#1B1A17; --card2:#27251F; --ink:#F3EFE7; --ink2:#D8D2C6; --muted:#9A9387; --sep:rgba(243,239,231,.12);
    --accent:#FF6A33; --accent-soft:rgba(255,106,51,.17); --link:#FF8F63; --green:#3BC47A; --red:#FF6B6E; --bar:rgba(17,16,14,.86);
    --shadow:0 10px 30px -12px rgba(0,0,0,.6); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,select{font-size:17px}
button{cursor:pointer}
a{color:var(--link)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.025em;font-weight:700}
#app{max-width:680px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(88px + var(--sab))}

/* top bars & titles */
.nav{position:sticky;top:0;z-index:10;padding:calc(var(--sat) + 8px) 16px 8px;background:var(--bar);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);display:flex;align-items:center;min-height:46px}
.nav .back{border:0;background:none;color:var(--ink);font-size:16px;font-weight:600;padding:6px 10px 6px 4px;display:flex;align-items:center;gap:4px;border-radius:99px}
.nav .back svg{width:11px;height:18px}
.nav .ttl{position:absolute;left:50%;transform:translateX(-50%);font-weight:650;font-size:16px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.iconbtn{position:relative;border:0;background:none;color:var(--ink);padding:6px;display:flex;border-radius:99px;font-weight:600}
.iconbtn svg{width:24px;height:24px}
.dot{position:absolute;top:0;right:-2px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg)}
.large{display:flex;align-items:flex-end;justify-content:space-between;padding:2px 16px 6px}
.large h1{font-size:38px;margin:0;line-height:1}
.content{padding:0 16px 28px}
.hint{color:var(--muted);font-size:15px;margin:6px 0 16px}
.sechead{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:28px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sechead span{font-family:-apple-system,system-ui,sans-serif;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.sechead button{border:0;background:none;color:var(--link);font:600 15px -apple-system,system-ui,sans-serif;padding:0}

/* lists */
.list{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--sep)}
.cell{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:50px;position:relative;width:100%;border:0;background:none;text-align:left;font-size:16px;color:var(--ink)}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:1px solid var(--sep)}
.cell.tap:active{background:var(--card2)}
.cell .main{flex:1;min-width:0}
.cell .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.cell .s{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .chev{color:var(--muted);opacity:.5;font-size:22px;line-height:1}
.cell .val{color:var(--muted);font-size:15px}
.cell.red{color:var(--red);justify-content:center;font-weight:600}
.cell.blue{color:var(--link);font-weight:600;justify-content:center}
.sq{width:46px;height:46px;border-radius:14px;background:var(--card2);color:var(--ink);display:flex;align-items:center;justify-content:center;font:700 22px var(--display);flex:none}
.sq.big{width:88px;height:88px;border-radius:26px;font-size:46px;margin:0 auto;background:var(--card);border:1px solid var(--sep);box-shadow:var(--shadow)}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--link);background:var(--accent-soft);overflow:hidden}
.avw{position:relative;display:inline-flex;flex:none}
.avw .em{position:absolute;right:-4px;bottom:-4px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px var(--bg)}
.stack{display:flex}.stack>*+*{margin-left:-9px}.stack .av{box-shadow:0 0 0 2px var(--card)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:99px;padding:11px 20px;font-weight:650;font-size:16px;background:var(--card2);color:var(--ink);text-decoration:none;transition:transform .12s,opacity .12s}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn.tint{background:var(--card2);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--sep)}
.btn.green{background:var(--accent);color:#fff}
.btn.full{width:100%;padding:16px;font-size:17px}
.btn.sm{padding:8px 15px;font-size:14px}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* group / event / profile headers */
.hero{text-align:center;padding:10px 16px 2px}
.hero h1{font-size:34px;margin:14px 0 4px;line-height:1.05}
.hero .s{color:var(--muted);font-size:15px}
.members{display:flex;gap:14px;overflow-x:auto;padding:16px 16px 4px;scrollbar-width:none;justify-content:safe center}
.members::-webkit-scrollbar{display:none}
.member{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);width:60px;flex:none;border:0;background:none;padding:0}
.member span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--card2);border-radius:99px;padding:3px;margin:18px 0 14px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:99px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -16px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr);margin:0;gap:6px}.grid .tile{border-radius:10px}}
.tile{position:relative;aspect-ratio:1;overflow:hidden;background:var(--card2);border:0;padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .15s}
.tile .tag{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:99px}
.tile .rx{position:absolute;right:6px;bottom:5px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:44px 24px;font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--ink);font:700 22px var(--display);letter-spacing:-.02em;margin-bottom:6px}
.empty .art{width:120px;margin:0 auto 14px;display:block}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--sep)}
.inbox{display:flex;gap:12px;align-items:center}
.inbox .main{flex:1;min-width:0}
.inbox .t{font-weight:650}
.inbox .s{color:var(--muted);font-size:14px}
/* inbox photo cards */
.ibgrid{display:grid;gap:14px}
@media (min-width:900px){.ibgrid{grid-template-columns:1fr 1fr}}
.ib{background:var(--card);border:1px solid var(--sep);border-radius:22px;overflow:hidden}
.ib-h{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ib-h .main{flex:1;min-width:0;line-height:1.25}
.ib-h b{display:block;font-size:15px}
.ib-h span{color:var(--muted);font-size:13px}
.ib-ph{display:block;width:100%;border:0;padding:0;background:var(--card2);aspect-ratio:4/5;overflow:hidden}
.ib-ph img{width:100%;height:100%;object-fit:cover;display:block}
.ib-a{display:flex;gap:8px;padding:12px}
.ib-a .btn{flex:1;padding:12px 8px}
.callout{background:var(--card);border:1px solid var(--sep);border-radius:18px;padding:14px 16px;margin:0 0 14px;display:flex;gap:12px;align-items:flex-start;font-size:15px}
.callout img{width:42px;height:42px;border-radius:11px}
.callout .x{border:0;background:none;color:var(--muted);font-size:18px;padding:0 0 0 4px;line-height:1}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--bar);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--sep);padding:7px 0 calc(var(--sab) + 5px)}
.tabbar button{position:relative;flex:0 1 120px;border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0}
.tabbar button.on{color:var(--ink)}
.tabbar button.on svg{color:var(--accent)}
.tabbar svg{width:26px;height:26px}
.tabbar .dot{top:-2px;right:calc(50% - 22px)}

/* profile setup steps */
.onb{max-width:440px;margin:0 auto;padding:calc(var(--sat) + 26px) 22px calc(var(--sab) + 26px);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.onb .logo{width:64px;height:64px;border-radius:16px;margin:8px auto 18px;display:block}
.onb h1{font-size:36px;text-align:center;margin:0 0 6px;line-height:1.05}
.onb .hint{text-align:center}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 20px}
.steps i{width:30px;height:4px;border-radius:2px;background:var(--sep)}
.steps i.on{background:var(--accent)}
.field{background:var(--card);border:1px solid var(--sep);border-radius:16px;margin-bottom:12px;overflow:hidden}
.field label{display:flex;align-items:center;padding:0 16px;min-height:52px;gap:10px}
.field label+label{border-top:1px solid var(--sep)}
.field label span{width:110px;flex:none;color:var(--ink);font-weight:550;font-size:15px}
.field input,.field textarea{flex:1;border:0;background:none;padding:13px 0;outline:none;min-width:0}
.field input::placeholder{color:var(--muted);opacity:.8}
.field textarea{resize:none;height:66px}
.field .at{color:var(--muted);margin-right:-8px}
.fnote{font-size:13px;color:var(--muted);margin:-4px 6px 14px}
.box{background:var(--card);border:1px solid var(--sep);border-radius:20px;padding:22px;text-align:center;margin-bottom:14px}
.facecirc{width:132px;height:132px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent)}
.okmsg{color:var(--green);font-weight:650;margin-bottom:10px}
.err{color:var(--red);font-size:14px;margin-top:10px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);margin:4px 4px 14px;cursor:pointer;line-height:1.4}
.check input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--accent)}
.onb .grow{flex:1;min-height:12px}
.link{border:0;background:none;color:var(--link);font-size:15px;font-weight:600;padding:10px;display:block;margin:4px auto 0}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px;background:var(--card);border:1px solid var(--sep);border-radius:16px;margin-bottom:12px}
.emojis button{border:0;background:none;font-size:26px;aspect-ratio:1;border-radius:12px;padding:0;line-height:1}
.emojis button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.avpick{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.avpick img{width:112px;height:112px;border-radius:50%;object-fit:cover}

/* sheets */
.dim{position:fixed;inset:0;z-index:30;background:rgba(17,16,14,.45);opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center}
.dim.show{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:calc(100dvh - var(--sat) - 12px);overflow:auto;border-radius:24px 24px 0 0;padding:0 16px calc(var(--sab) + 22px);transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.9,.25,1)}
.dim.show .sheet{transform:none}
@media (min-width:700px){.dim{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:8px auto 0}
.shh{display:flex;align-items:center;justify-content:space-between;padding:12px 0 14px;position:sticky;top:0;background:var(--bg);z-index:2}
.shh .ttl{font:700 17px var(--display);letter-spacing:-.01em}
.shh button{border:0;background:none;color:var(--muted);font-size:16px;font-weight:550;padding:4px 0;min-width:64px;text-align:left}
.shh button.done{color:var(--link);font-weight:700;text-align:right}

/* photo viewer */
#viewer{position:fixed;inset:0;z-index:40;background:#0B0A09;color:#F3EFE7;display:none;flex-direction:column}
#viewer.show{display:flex}
.vtop{display:flex;align-items:center;padding:calc(var(--sat) + 8px) 12px 8px;gap:10px}
.vtop button{border:0;background:rgba(243,239,231,.12);color:#F3EFE7;width:36px;height:36px;border-radius:50%;font-size:17px;display:flex;align-items:center;justify-content:center}
.vtop .vt{flex:1;text-align:center;font:700 16px var(--display)}
.vtop .vs{font:400 13px -apple-system,system-ui,sans-serif;color:#A39C90}
.vimg{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y;position:relative}
.vwrap{position:relative;display:inline-block;line-height:0}
.vwrap img{max-width:100vw;max-height:calc(100dvh - var(--sat) - var(--sab) - 214px);display:block}
.fbox{position:absolute;border:2px solid var(--accent);border-radius:10px;line-height:1.2}
.fbox.unk{border-color:rgba(243,239,231,.75);border-style:dashed}
.fbox span{position:absolute;left:50%;transform:translateX(-50%);bottom:-25px;white-space:nowrap;background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.fbox.unk span{background:rgba(243,239,231,.9);color:#161513}
.hidebox .fbox{display:none}
.vbot{padding:10px 16px calc(var(--sab) + 14px)}
.rxbar{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.rxbar button{border:0;background:rgba(243,239,231,.1);border-radius:99px;padding:6px 11px;font-size:20px;color:#F3EFE7;display:flex;align-items:center;gap:4px}
.rxbar button.on{background:var(--accent)}
.rxbar small{font-size:13px;font-weight:700}
.vact{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.vact .btn{background:rgba(243,239,231,.12);color:#F3EFE7}
.vact .btn.green,.vact .btn.fill{background:var(--accent);color:#fff}
.vact .btn.red{color:#FF8A8C}
.varrow{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(243,239,231,.14);color:#F3EFE7;width:46px;height:46px;border-radius:50%;font-size:26px;line-height:1;display:none;z-index:2}

/* camera */
#cam{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:var(--sat) 0 var(--sab)}
#cam.show{display:flex}
#cam video{width:100%;max-width:600px;max-height:70dvh;object-fit:cover;transform:scaleX(-1)}
#cam .shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid #000;box-shadow:0 0 0 3px #fff}
#cam .cancel{position:absolute;left:20px;bottom:calc(var(--sab) + 34px);border:0;background:none;color:#fff;font-size:17px}

/* banners & toasts */
#banner{position:fixed;left:8px;right:8px;top:calc(var(--sat) + 8px);z-index:60;max-width:440px;margin:0 auto;background:var(--card);border:1px solid var(--sep);border-radius:20px;padding:12px 14px;display:flex;gap:11px;align-items:center;box-shadow:0 14px 40px rgba(22,21,19,.22);transform:translateY(-140%);transition:transform .4s cubic-bezier(.2,.9,.25,1);cursor:pointer}
#banner:not(.show){box-shadow:none;visibility:hidden;transition:transform .4s cubic-bezier(.2,.9,.25,1),visibility 0s .4s}
#banner.show{transform:none}
#banner img{width:38px;height:38px;border-radius:10px}
#banner .bt{font:700 15px var(--display);display:flex;justify-content:space-between}
#banner .bt small{color:var(--muted);font:400 13px -apple-system,system-ui,sans-serif}
#banner .bb{font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 98px);transform:translate(-50%,10px);opacity:0;transition:.25s;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-size:15px;font-weight:550;z-index:70;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;left:50%;top:calc(var(--sat) + 10px);transform:translateX(-50%);z-index:65;display:none;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:9px 16px 9px 34px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap}
#busy::before{content:"";position:absolute;left:13px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#busy.show{display:block}
.loading{display:flex;align-items:center;justify-content:center;min-height:80vh;color:var(--muted)}
.notif{display:flex;gap:12px;align-items:center}
.notif.unread .t{font-weight:700}
.notif .when{color:var(--muted);font-size:13px;flex:none}
.udot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.prof{text-align:center;padding:6px 16px 0}
.prof .nm{font:700 30px var(--display);letter-spacing:-.025em;margin-top:12px}
.prof .un{color:var(--muted)}
.prof .bio{margin-top:6px;font-size:15px}
.stats{display:flex;background:var(--card);border:1px solid var(--sep);border-radius:18px;margin:20px 0 0;padding:14px 0}
.stats div{flex:1;text-align:center}
.stats b{display:block;font:700 24px var(--display);letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--muted)}
.stats div+div{border-left:1px solid var(--sep)}
.linkbox{background:var(--card);border:1px solid var(--sep);border-radius:14px;padding:14px;font-size:14px;word-break:break-all;color:var(--muted);margin-bottom:12px;user-select:all;-webkit-user-select:all}

/* laptop & desktop: side menu */
.sbrand{display:none}
@media (hover:hover){
  .cell.tap:hover{background:var(--card2)}
  .tile:hover img{filter:brightness(.9)}
  .btn:hover{opacity:.88}
  .varrow{display:flex;align-items:center;justify-content:center}
  .varrow:hover{background:rgba(243,239,231,.28)}

  try { await A.sendPasswordResetEmail(AUTH, email); toast('Check your email for a link to reset your password.'); showAuth('login'); } catch (e){ authErr(e); }
}

/* hand-drawn instant-film prints for the landing page */
function brk(cx, cy, r, col){ const s = r * 1.4, c = r * .6, x0 = cx - s, y0 = cy - s, x1 = cx + s, y1 = cy + s;
  return `<path d="M${x0} ${y0 + c}V${y0}H${x0 + c}M${x1 - c} ${y0}H${x1}V${y0 + c}M${x1} ${y1 - c}V${y1}H${x1 - c}M${x0 + c} ${y1}H${x0}V${y1 - c}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`; }
function tagS(x, y, t, bg, fg){ const w = t.length * 6.3 + 14; return `<g transform="translate(${x - w / 2} ${y})"><rect width="${w}" height="17" rx="8.5" fill="${bg}"/><text x="${w / 2}" y="12" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="10" font-weight="700" fill="${fg}">${t}</text></g>`; }
function pers(cx, hy, r, skin, shirt, hair){
  return `<path d="M${cx - r * 2.2} 200Q${cx - r * 2.1} ${hy + r * 1.7} ${cx} ${hy + r * 1.45}Q${cx + r * 2.1} ${hy + r * 1.7} ${cx + r * 2.2} 200Z" fill="${shirt}"/><circle cx="${cx}" cy="${hy}" r="${r}" fill="${skin}"/>`
    + (hair ? `<path d="M${cx - r * 1.04} ${hy - r * .05}A${r * 1.04} ${r * 1.04} 0 0 1 ${cx + r * 1.04} ${hy - r * .05}Q${cx + r * .2} ${hy - r * .62} ${cx - r * 1.04} ${hy - r * .05}Z" fill="${hair}"/>` : ''); }

/* admin panel data: one-time loads of everything, refreshed on demand */
let ADM = null, admLoading = false;
async function loadAdmin(){
  if (admLoading) return; admLoading = true; busy('Loading Admin Data…');
  try {
    const all = async c => (await F.getDocs(col(c))).docs.map(d => ({id:d.id, ...d.data()}));
    const [users, groups, events, photos] = await Promise.all(['users', 'groups', 'events', 'photos'].map(all));
    ADM = {users, groups, events, photos};
    photos.forEach(p => { if (!C.photos[p.id]) C.extra[p.id] = p; });
    events.forEach(e => { if (!evt(e.id)) C.extraEvents[e.id] = e; });
    users.forEach(u => { if (!C.users[u.id]) C.users[u.id] = u; });
  } catch (e){ console.warn(e); toast("Couldn't load admin data."); ADM = {users:[], groups:[], events:[], photos:[]}; }
  admLoading = false; busy(); render();
}

async function admJoin(kind, id){ await F.updateDoc(ref(kind === 'group' ? 'groups' : 'events', id), {members:F.arrayUnion(ME)}); closeSheet(); ADM = null; toast('Joined.'); }
async function commitOps(ops){ for (let i = 0; i < ops.length; i += 400){ const b = F.writeBatch(db); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); } }
async function admDeleteThing(kind, id){
  const t = (kind === 'group' ? ADM.groups : ADM.events).find(x => x.id === id);
  if (!confirm(`Delete ${t.name} and all of its photos for everyone? This can't be undone.`)) return;
  busy('Deleting…');
  try {
    const eids = kind === 'group' ? (await F.getDocs(F.query(col('events'), F.where('groupId', '==', id)))).docs.map(d => d.id) : [id], ops = [];
    for (let i = 0; i < eids.length; i += 30){
      const chunk = eids.slice(i, i + 30);
      const [ps, ds, rs] = await Promise.all([F.getDocs(F.query(col('photos'), F.where('eventId', 'in', chunk))), F.getDocs(F.query(col('deliveries'), F.where('eventId', 'in', chunk))), F.getDocs(F.query(col('requests'), F.where('eventId', 'in', chunk)))]);
      ps.docs.forEach(d => { ops.push(b => b.delete(d.ref)); ops.push(b => b.delete(ref('images', d.id))); });
      ds.docs.concat(rs.docs).forEach(d => ops.push(b => b.delete(d.ref)));
    }
    eids.forEach(e => ops.push(b => b.delete(ref('events', e))));
    if (kind === 'group') ops.push(b => b.delete(ref('groups', id)));
    await commitOps(ops); closeSheet(); toast(`${t.name} deleted.`);
  } catch (e){ console.warn(e); toast("Couldn't delete everything. Try again."); }
  ADM = null; busy(); render();
}
async function admDeleteUser(id){
  const u = ADM.users.find(x => x.id === id);
  if (!confirm(`Delete @${u.username} and all their face data? This can't be undone.`)) return;
  busy('Deleting…');
  try { await deleteUserData(id, u.username); closeSheet(); toast(`@${u.username} deleted.`); } catch (e){ console.warn(e); toast("Couldn't delete everything. Try again."); }
  ADM = null; busy(); render();
}

/* ---------- synced data ---------- */
const C = { users:{}, groups:{}, sEvents:{}, gEvents:{}, photos:{}, extra:{}, extraEvents:{}, deliveries:{}, notifs:[], reqIn:{}, reqOut:{} };
const BOOT_AT = Date.now();
let subs = {}, userSubs = {}, dyn = {}, notifLoaded = false;
const toMap = snap => Object.fromEntries(snap.docs.map(d => [d.id, {id:d.id, ...d.data()}]));
function syncErr(e){ console.warn(e); if (e?.code === 'permission-denied') toast('Sync is blocked. The database rules need updating.'); }
function listen(key, q, fn){ subs[key]?.(); subs[key] = F.onSnapshot(q, fn, syncErr); }
function stopAll(){
  Object.values(subs).forEach(u => u()); Object.values(userSubs).forEach(u => u());
  Object.values(dyn).forEach(d => d.unsubs.forEach(u => u()));
  subs = {}; userSubs = {}; dyn = {}; notifLoaded = false;
  Object.assign(C, {users:{}, groups:{}, sEvents:{}, gEvents:{}, photos:{}, extra:{}, extraEvents:{}, deliveries:{}, notifs:[], reqIn:{}, reqOut:{}});
}
// Live "where field in [...]" listener that re-subscribes only when the list changes (Firestore allows 30 per query).
function subIn(name, coll, field, values, onDocs){
  const vals = [...new Set(values)].sort(), sig = vals.join(',');
  if (dyn[name] && dyn[name].sig === sig) return;
  dyn[name]?.unsubs.forEach(u => u());
  const parts = {}, unsubs = [];
  for (let i = 0; i < vals.length; i += 30){
    const k = i;

/* ---------- face scanning (in the browser) ---------- */
let modelsReady = null;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function ensureModels(){
  if (!modelsReady){
    busy('Loading Face Scanner…');
    modelsReady = (async () => {
      if (!window.faceapi) await loadScript(FACEAPI + 'dist/face-api.js');
      const u = FACEAPI + 'model/';
      await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(u), faceapi.nets.faceLandmark68Net.loadFromUri(u), faceapi.nets.faceRecognitionNet.loadFromUri(u)]);
    })().finally(() => busy()).catch(() => { modelsReady = null; throw 'Could not load the face scanner. Check your connection.'; });
  }
  return modelsReady;
}
function loadImage(url){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej("Couldn't open that photo."); i.src = url; }); }
async function toCanvas(src, max){
  const url = typeof src === 'string' ? src : URL.createObjectURL(src);
  const img = await loadImage(url); if (typeof src !== 'string') URL.revokeObjectURL(url);
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c;
}
function shrink(canvas, max, q){
  const s = Math.min(1, max / Math.max(canvas.width, canvas.height));
  const c = document.createElement('canvas'); c.width = Math.round(canvas.width * s); c.height = Math.round(canvas.height * s);
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q);
}
function squareCrop(canvas, size, box){
  const side = box ? Math.max(box.width, box.height) * 1.8 : Math.min(canvas.width, canvas.height);
  const cx = box ? box.x + box.width / 2 : canvas.width / 2, cy = box ? box.y + box.height / 2 : canvas.height / 2;
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(canvas, cx - side / 2, cy - side / 2, side, side, 0, 0, size, size);
  return c.toDataURL('image/jpeg', .85);
}
const detect = c => faceapi.detectAllFaces(c, new faceapi.SsdMobilenetv1Options({minConfidence:.5, maxResults:60})).withFaceLandmarks().withFaceDescriptors();
function relBox(d, c){ const b = d.detection.box; return {x:b.x / c.width, y:b.y / c.height, w:b.width / c.width, h:b.height / c.height}; }
function iou(a, b){ const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y), x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h); const i = Math.max(0, x2 - x1) * Math.max(0, y2 - y1); return i / (a.w * a.h + b.w * b.h - i || 1); }
// Pair each face with the closest event member; each person is used once per photo.
// Only face boxes + who matched are saved — never face signatures of people in photos.
function assign(dets, c, members){
  const faces = dets.map(d => ({box:relBox(d, c), matchId:null})), pairs = [];
  dets.forEach((d, i) => members.forEach(u => { const dist = faceapi.euclideanDistance(d.descriptor, u.descriptor); if (dist < MATCH) pairs.push({i, u:u.id, dist}); }));
  pairs.sort((a, b) => a.dist - b.dist); const used = new Set();
  for (const p of pairs){ if (faces[p.i].matchId || used.has(p.u)) continue; faces[p.i].matchId = p.u; used.add(p.u); }
  return faces;
}

/* ---------- uploading & matching ---------- */
async function membersWithFaces(e, notMe){
  const ids = eventMembers(e).filter(id => !(notMe || []).includes(id));
  for (const id of ids) if (!C.users[id]){ const s = await F.getDoc(ref('users', id)); if (s.exists()) C.users[id] = {id, ...s.data()}; }
  return ids.map(id => C.users[id]).filter(u => u?.descriptor);
}
async function upload(eid, list){
  const files = [...list]; if (!files.length) return;
  const e = evt(eid);
  try { await ensureModels(); } catch (err){ return toast(err); }
  const members = await membersWithFaces(e), perUser = {};
  let done = 0, uncat = 0, failed = 0;
  for (const f of files){
    busy(`Scanning Photo ${done + failed + 1} of ${files.length}…`);
    try {
      const c = await toCanvas(f, 1600), dets = await detect(c), faces = assign(dets, c, members);
      let data = null; for (const [m, q] of [[1600, .82], [1400, .75], [1200, .7], [1000, .65]]){ data = shrink(c, m, q); if (data.length < 900000) break; }
      const r = F.doc(col('photos')), b = F.writeBatch(db), now = Date.now();
      const matched = faces.filter(x => x.matchId).map(x => x.matchId);
      b.set(r, {eventId:eid, uploaderId:ME, w:c.width, h:c.height, faces, matched, notMe:[], reactions:{}, thumb:shrink(c, 420, .72), createdAt:now});
      b.set(ref('images', r.id), {data, eventId:eid});
      matched.forEach(u => { b.set(ref('deliveries', `${r.id}_${u}`), {photoId:r.id, eventId:eid, userId:u, uploaderId:ME, status:'pending', via:'face', at:now}); perUser[u] = (perUser[u] || 0) + 1; });
      await b.commit(); fullCache.set(r.id, data);
      if (isUncat({faces})) uncat++; done++;
    } catch (err){ console.warn(err); failed++; }
  }
  busy();
  // Uploading to an event answers any photo requests you had for it.
  const answered = Object.values(C.reqIn).filter(r => r.eventId === eid && r.status === 'open');
  if (done && answered.length){
    const b = F.writeBatch(db); answered.forEach(r => b.update(ref('requests', r.id), {status:'done', doneAt:Date.now(), count:done})); await b.commit();
    answered.forEach(r => notify([r.fromId], `${handle(ME)} uploaded ${plural(done, 'photo')} from ${e.name} like you asked`, {v:'event', id:eid, seg:'mine'}));
  }
  for (const [u, n] of Object.entries(perUser)) notify([u], `${handle(ME)} added ${plural(n, 'photo')} of you from ${e.name}`, {v:'inbox'});
  if (uncat) notify(eventMembers(e), `${plural(uncat, 'new photo')} in ${e.name} need${uncat === 1 ? 's' : ''} someone to claim ${uncat === 1 ? 'it' : 'them'}`, {v:'event', id:eid, seg:'uncat'});
  const sent = Object.values(perUser).reduce((a, b) => a + b, 0);
  toast(`${plural(done, 'photo')} added · ${sent} sent · ${uncat} uncategorized${failed ? ` · ${failed} failed` : ''}`);
}
// After you join (or update your selfie), look through earlier photos for faces nobody was matched to.
async function rescanForMe(eids){
  const u = me() || (await F.getDoc(ref('users', ME))).data(); if (!u?.descriptor || !eids.length) return;
  let photos = [];
  for (let i = 0; i < eids.length; i += 30){ const s = await F.getDocs(F.query(col('photos'), F.where('eventId', 'in', eids.slice(i, i + 30)))); photos.push(...s.docs.map(d => ({id:d.id, ...d.data()}))); }
  photos = photos.filter(p => p.faces?.some(f => !f.matchId) && !(p.notMe || []).includes(ME) && !(p.matched || []).includes(ME));
  if (!photos.length) return;
  try { await ensureModels(); } catch (e){ return; }
  let n = 0, found = 0;
  for (const p of photos){
    busy(`Looking For You In Earlier Photos ${++n}/${photos.length}…`);
    try {
      const data = await getFull(p.id); if (!data) continue;
      const c = await toCanvas(data, 1600), dets = await detect(c); let best = null;
      dets.forEach(d => { const dist = faceapi.euclideanDistance(d.descriptor, u.descriptor); if (dist < MATCH && (!best || dist < best.dist)) best = {d, dist}; });
      if (!best) continue;
      const box = relBox(best.d, c); let idx = -1, bi = .3;
      p.faces.forEach((f, i) => { if (f.matchId) return; const v = iou(f.box, box); if (v > bi){ bi = v; idx = i; } });
      if (idx < 0) continue;
      const b = F.writeBatch(db);
      b.update(ref('photos', p.id), {faces:p.faces.map((f, i) => i === idx ? {...f, matchId:ME} : f), matched:F.arrayUnion(ME)});
      b.set(ref('deliveries', `${p.id}_${ME}`), {photoId:p.id, eventId:p.eventId, userId:ME, uploaderId:p.uploaderId, status:'pending', via:'face', at:Date.now()});
      await b.commit(); found++;
    } catch (e){ console.warn(e); }
  }
  busy(); if (found) toast(`Found you in ${plural(found, 'earlier photo')}. Check your Inbox.`);
}

/* ---------- approving & reacting ---------- */
async function decide(pid, action){
  const d = myDel(pid), p = photo(pid); if (!d || !p) return;
  if (action === 'keep'){ await F.updateDoc(ref('deliveries', d.id), {status:'approved'}); toast('Saved to Your Photos.'); }
  if (action === 'skip'){ await F.updateDoc(ref('deliveries', d.id), {status:'declined'}); toast('Skipped.'); }
  if (action === 'notme'){
    const b = F.writeBatch(db);
    b.update(ref('photos', pid), {faces:p.faces.map(f => f.matchId === ME ? {...f, matchId:null} : f), matched:F.arrayRemove(ME), notMe:F.arrayUnion(ME)});
    b.delete(ref('deliveries', d.id)); await b.commit();
    toast('Moved to Uncategorized so the right person can grab it.');
  }
  viewerAfterAction(pid);
}
async function keepAll(){ const b = F.writeBatch(db); pending().forEach(d => b.update(ref('deliveries', d.id), {status:'approved'})); await b.commit(); toast('All saved to Your Photos.'); }
async function claim(pid){
  const p = photo(pid);
  await F.setDoc(ref('deliveries', `${pid}_${ME}`), {photoId:pid, eventId:p.eventId, userId:ME, uploaderId:p.uploaderId, status:'approved', via:'claimed', at:Date.now()});
  notify([p.uploaderId], `${handle(ME)} found themselves in your photo from ${evt(p.eventId)?.name || 'an event'}`, {v:'photo', id:pid});
  toast('Added to Your Photos.'); viewerAfterAction(pid);
}
async function react(pid, e){
  const p = photo(pid), cur = p.reactions?.[ME];
  await F.updateDoc(ref('photos', pid), {[`reactions.${ME}`]:cur === e ? F.deleteField() : e});
  if (cur !== e) notify([p.uploaderId], `${handle(ME)} reacted ${e} to your photo`, {v:'photo', id:pid});
}
async function deletePhoto(pid){
  if (!confirm('Delete this photo for everyone?')) return;
  const ds = await F.getDocs(F.query(col('deliveries'), F.where('photoId', '==', pid)));
  const b = F.writeBatch(db); ds.docs.forEach(d => b.delete(d.ref)); b.delete(ref('photos', pid)); b.delete(ref('images', pid)); await b.commit();
  if (ADM) ADM.photos = ADM.photos.filter(x => x.id !== pid);
  closeViewer(); toast('Photo deleted.');
}
async function savePhoto(pid){
  const data = await getFull(pid); if (!data) return toast("Couldn't load the photo.");
  const blob = await (await fetch(data)).blob(), file = new File([blob], `inframe-${pid}.jpg`, {type:'image/jpeg'});
  if (navigator.canShare?.({files:[file]})){ try { await navigator.share({files:[file]}); } catch {} return; }
  const a = document.createElement('a'); a.href = data; a.download = file.name; a.click();
}

/* ---------- full-screen photo viewer ---------- */
let vList = [], vIdx = 0, vBoxes = true;
async function openViewer(pid, list){ pushNav(); vList = list && list.length ? list : [pid]; vIdx = Math.max(0, vList.indexOf(pid)); $('#viewer').classList.add('show'); document.body.style.overflow = 'hidden'; drawViewer(); }
function closeViewer(){ $('#viewer').classList.remove('show'); $('#viewer').innerHTML = ''; document.body.style.overflow = ''; }
function viewerAfterAction(pid){ if (!$('#viewer').classList.contains('show')) return; if (view.name === 'tab' && view.tab === 'inbox'){ vList = vList.filter(x => x !== pid); if (!vList.length) return closeViewer(); vIdx = Math.min(vIdx, vList.length - 1); } setTimeout(drawViewer, 150); }
async function drawViewer(){
  const pid = vList[vIdx], p = photo(pid); if (!p) return closeViewer();
  const e = evt(p.eventId), d = myDel(pid);
  const boxes = (p.faces || []).map(f => `<div class="fbox ${f.matchId ? '' : 'unk'}" style="left:${f.box.x * 100}%;top:${f.box.y * 100}%;width:${f.box.w * 100}%;height:${f.box.h * 100}%"><span>${f.matchId ? esc(handle(f.matchId)) : '?'}</span></div>`).join('');
  const counts = {}; Object.values(p.reactions || {}).forEach(r => counts[r] = (counts[r] || 0) + 1);
  const mine = p.reactions?.[ME];
  let acts = '';
  if (d?.status === 'pending') acts = `<button class="btn green" onclick="decide('${pid}','keep')">Keep</button><button class="btn" onclick="decide('${pid}','skip')">Skip</button><button class="btn" onclick="decide('${pid}','notme')">Not Me</button>`;
  else if (!d && isUncat(p) && eventMembers(e).includes(ME)) acts = `<button class="btn fill" onclick="claim('${pid}')">I'm In This One</button>`;
  acts += `<button class="btn" onclick="savePhoto('${pid}')">Save</button>`;
  if (p.uploaderId === ME || isAdminNow()) acts +=`<button class="btn red" onclick="deletePhoto('${pid}')">Delete</button>`;
  $('#viewer').innerHTML = `
    <div class="vtop"><button onclick="closeViewer()" aria-label="Close">✕</button>
      <div class="vt">${esc(e?.name || '')}<div class="vs">${esc(handle(p.uploaderId))} · ${ago(p.createdAt)}${vList.length > 1 ? ` · ${vIdx + 1} of ${vList.length}` : ''}</div></div>
      <button onclick="vBoxes=!vBoxes;$('.vimg').classList.toggle('hidebox',!vBoxes)" aria-label="Show Names" style="font-size:13px;font-weight:700">@</button></div>
    <div class="vimg ${vBoxes ? '' : 'hidebox'}">${vList.length > 1 ? `<button class="varrow" style="left:16px" onclick="step(-1)" aria-label="Previous">‹</button><button class="varrow" style="right:16px" onclick="step(1)" aria-label="Next">›</button>` : ''}<div class="vwrap"><img src="${fullCache.get(pid) || p.thumb}" id="vimg" alt="">${boxes}</div></div>
    <div class="vbot"><div class="rxbar">${REACTS.map(r => `<button class="${mine === r ? 'on' : ''}" onclick="react('${pid}','${r}')">${r}${counts[r] ? `<small>${counts[r]}</small>` : ''}</button>`).join('')}</div>
      <div class="vact">${acts}</div></div>`;
  const full = await getFull(pid); if (full && vList[vIdx] === pid && $('#vimg')) $('#vimg').src = full;
  const area = $('.vimg'); let sx = null;
  area.ontouchstart = ev => sx = ev.touches[0].clientX;
  area.ontouchend = ev => { if (sx == null) return; const dx = ev.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); };
}
function step(n){ const i = vIdx + n; if (i < 0 || i >= vList.length) return; vIdx = i; drawViewer(); }
document.addEventListener('keydown', e => { if (!$('#viewer').classList.contains('show')) return; if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'Escape') closeViewer(); });

async function deleteAccount(){

    if (!isAdminId(ME)) { try { await A.deleteUser(AUTH.currentUser); } catch (e){ console.warn(e); } }
    try { await A.signOut(AUTH); } catch {}

async function deleteUserData(id, username){
  const q = (c, f, op, v) => F.getDocs(F.query(col(c), F.where(f, op, v)));
  const [ds, ns, ps, gs, es, r1, r2] = await Promise.all([q('deliveries', 'userId', '==', id), q('notifications', 'userId', '==', id), q('photos', 'matched', 'array-contains', id), q('groups', 'members', 'array-contains', id), q('events', 'members', 'array-contains', id), q('requests', 'toId', '==', id), q('requests', 'fromId', '==', id)]);
  const ops = [];
  ds.docs.concat(ns.docs, r1.docs, r2.docs).forEach(d => ops.push(b => b.delete(d.ref)));
  ps.docs.forEach(d => ops.push(b => b.update(d.ref, {faces:d.data().faces.map(f => f.matchId === id ? {...f, matchId:null} : f), matched:F.arrayRemove(id)})));
  gs.docs.concat(es.docs).forEach(d => ops.push(b => b.update(d.ref, {members:F.arrayRemove(id)})));
  if (username) ops.push(b => b.delete(ref('usernames', username)));
  ops.push(b => b.delete(ref('users', id)));
  await commitOps(ops);
}
