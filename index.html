<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="InFrame">
<meta name="application-name" content="InFrame">
<meta name="description" content="Share event photos with friends. Everyone gets the photos they're in.">
<meta name="theme-color" content="#F3EFE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11100E" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="tab-icon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="tab-icon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="shortcut icon" href="tab-icon.ico?v=2">
<title>InFrame</title>
<script>/* apply the saved Light/Dark choice before anything draws */
try { const t = localStorage.getItem('inframe_theme'); if (t === 'light' || t === 'dark'){ document.documentElement.dataset.theme = t; document.querySelectorAll('meta[name=theme-color]').forEach(m => { m.content = t === 'dark' ? '#11100E' : '#F3EFE7'; m.removeAttribute('media'); }); } } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* ============ InFrame design system: photo paper, ink, film orange ============ */
:root{
  --bg:#F3EFE7; --card:#FFFDF9; --card2:#EBE6DC; --ink:#161513; --ink2:#3A3733; --muted:#7D766C; --sep:rgba(22,21,19,.11);
  --accent:#FF5B24; --accent-soft:rgba(255,91,36,.13); --link:#C93F0D; --green:#1E9E5A; --red:#DC3B3F;
  --bar:rgba(243,239,231,.86); --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --shadow:0 1px 0 rgba(22,21,19,.04),0 10px 30px -12px rgba(22,21,19,.18);
}
/* Appearance: Automatic follows the phone; Light / Dark are picked in Profile (saved as data-theme on <html>). */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --bg:#11100E; --card:#1B1A17; --card2:#27251F; --ink:#F3EFE7; --ink2:#D8D2C6; --muted:#9A9387; --sep:rgba(243,239,231,.12);
    --accent:#FF6A33; --accent-soft:rgba(255,106,51,.17); --link:#FF8F63; --green:#3BC47A; --red:#FF6B6E; --bar:rgba(17,16,14,.86);
    --shadow:0 10px 30px -12px rgba(0,0,0,.6); }
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#11100E; --card:#1B1A17; --card2:#27251F; --ink:#F3EFE7; --ink2:#D8D2C6; --muted:#9A9387; --sep:rgba(243,239,231,.12);
  --accent:#FF6A33; --accent-soft:rgba(255,106,51,.17); --link:#FF8F63; --green:#3BC47A; --red:#FF6B6E; --bar:rgba(17,16,14,.86);
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); }
:root[data-theme="light"]{ color-scheme:light; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,select{font-size:17px}
button{cursor:pointer}
a{color:var(--link)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.025em;font-weight:700}
#app{max-width:680px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(88px + var(--sab))}

/* top bars & titles */
.nav{position:sticky;top:0;z-index:10;padding:calc(var(--sat) + 8px) 16px 8px;background:var(--bar);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);display:flex;align-items:center;min-height:46px}
.nav .back{border:0;background:none;color:var(--ink);font-size:16px;font-weight:600;padding:6px 10px 6px 4px;display:flex;align-items:center;gap:4px;border-radius:99px}
.nav .back svg{width:11px;height:18px}
.nav .ttl{position:absolute;left:50%;transform:translateX(-50%);font-weight:650;font-size:16px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.iconbtn{position:relative;border:0;background:none;color:var(--ink);padding:6px;display:flex;border-radius:99px;font-weight:600}
.iconbtn svg{width:24px;height:24px}
.dot{position:absolute;top:0;right:-2px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg)}
.large{display:flex;align-items:flex-end;justify-content:space-between;padding:2px 16px 6px}
.large h1{font-size:38px;margin:0;line-height:1}
.content{padding:0 16px 28px}
.hint{color:var(--muted);font-size:15px;margin:6px 0 16px}
.sechead{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:28px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sechead span{font-family:-apple-system,system-ui,sans-serif;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.sechead button{border:0;background:none;color:var(--link);font:600 15px -apple-system,system-ui,sans-serif;padding:0}

/* lists */
.list{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--sep)}
.cell{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:50px;position:relative;width:100%;border:0;background:none;text-align:left;font-size:16px;color:var(--ink)}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:1px solid var(--sep)}
.cell.tap:active{background:var(--card2)}
.cell .main{flex:1;min-width:0}
.cell .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.cell .s{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .chev{color:var(--muted);opacity:.5;font-size:22px;line-height:1}
.cell .val{color:var(--muted);font-size:15px}
.cell.red{color:var(--red);justify-content:center;font-weight:600}
.cell.blue{color:var(--link);font-weight:600;justify-content:center}
.sq{width:46px;height:46px;border-radius:14px;background:var(--card2);color:var(--ink);display:flex;align-items:center;justify-content:center;font:700 22px var(--display);flex:none}
.sq img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.sq.big{width:88px;height:88px;border-radius:26px;font-size:46px;margin:0 auto;background:var(--card);border:1px solid var(--sep);box-shadow:var(--shadow)}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--link);background:var(--accent-soft);overflow:hidden}
.avw{position:relative;display:inline-flex;flex:none}
.avw .em{position:absolute;right:-4px;bottom:-4px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px var(--bg)}
.stack{display:flex}.stack>*+*{margin-left:-9px}.stack .av{box-shadow:0 0 0 2px var(--card)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:99px;padding:11px 20px;font-weight:650;font-size:16px;background:var(--card2);color:var(--ink);text-decoration:none;transition:transform .12s,opacity .12s}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn.tint{background:var(--card2);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--sep)}
.btn.green{background:var(--accent);color:#fff}
.btn.full{width:100%;padding:16px;font-size:17px}
.btn.sm{padding:8px 15px;font-size:14px}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* group / event / profile headers */
.hero{text-align:center;padding:10px 16px 2px}
.hero h1{font-size:34px;margin:14px 0 4px;line-height:1.05}
.hero .s{color:var(--muted);font-size:15px}
.members{display:flex;gap:14px;overflow-x:auto;padding:16px 16px 4px;scrollbar-width:none;justify-content:safe center}
.members::-webkit-scrollbar{display:none}
.member{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);width:60px;flex:none;border:0;background:none;padding:0}
.member span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--card2);border-radius:99px;padding:3px;margin:18px 0 14px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:99px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -16px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr);margin:0;gap:6px}.grid .tile{border-radius:10px}}
.tile{position:relative;aspect-ratio:1;overflow:hidden;background:var(--card2);border:0;padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .15s}
.tile .tag{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:99px}
.tile .rx{position:absolute;right:6px;bottom:5px;font-size:13px}
.qrbox{position:relative;width:min(62vw,230px);aspect-ratio:1;margin:18px auto 0;background:#fff;border-radius:18px;padding:10px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.qrbox svg{width:100%;height:100%;display:block}
.qrbox img{position:absolute;width:20%;height:20%;left:40%;top:40%;border-radius:8px;background:#fff;padding:3px}
.savepick .tick{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.savepick.off img{opacity:.35;filter:grayscale(1)}
.savepick.off .tick{background:rgba(0,0,0,.35);color:transparent}
.vmark{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;background:rgba(11,10,9,.62);color:#fff;padding:3px 8px;border-radius:99px;pointer-events:none}
.vmark.big{left:12px;top:12px;font-size:13px;padding:5px 10px}
.ib-ph{position:relative}
.vwrap video{max-width:100vw;max-height:calc(100dvh - var(--sat) - var(--sab) - 214px);display:block;background:#000}
.vload{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(11,10,9,.7);color:#fff;font-size:14px;font-weight:600;padding:8px 14px;border-radius:99px;line-height:1.2;white-space:nowrap}
.tabbar .postbtn{color:var(--bg)}
.tabbar .postbtn svg{width:22px;height:22px;background:var(--accent);color:#fff;border-radius:12px;padding:8px;box-sizing:content-box;margin-top:-4px}
.tabbar .postbtn span{color:var(--ink);margin-top:-1px}
body.dropping #app{outline:3px dashed var(--accent);outline-offset:-10px;border-radius:20px}
.empty{text-align:center;color:var(--muted);padding:44px 24px;font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--ink);font:700 22px var(--display);letter-spacing:-.02em;margin-bottom:6px}
.empty .art{width:120px;margin:0 auto 14px;display:block}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--sep)}
.inbox{display:flex;gap:12px;align-items:center}
.inbox .main{flex:1;min-width:0}
.inbox .t{font-weight:650}
.inbox .s{color:var(--muted);font-size:14px}
/* inbox photo cards */
.ibgrid{display:grid;gap:14px}
@media (min-width:900px){.ibgrid{grid-template-columns:1fr 1fr}}
.ib{background:var(--card);border:1px solid var(--sep);border-radius:22px;overflow:hidden}
.ib-h{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ib-h .main{flex:1;min-width:0;line-height:1.25}
.ib-h b{display:block;font-size:15px}
.ib-h span{color:var(--muted);font-size:13px}
.ib-ph{display:block;width:100%;border:0;padding:0;background:var(--card2);aspect-ratio:4/5;overflow:hidden}
.ib-ph img{width:100%;height:100%;object-fit:cover;display:block}
.ib-a{display:flex;gap:8px;padding:12px}
.ib-a .btn{flex:1;padding:12px 8px}
.callout{background:var(--card);border:1px solid var(--sep);border-radius:18px;padding:14px 16px;margin:0 0 14px;display:flex;gap:12px;align-items:flex-start;font-size:15px}
.callout img{width:42px;height:42px;border-radius:11px}
.callout .x{border:0;background:none;color:var(--muted);font-size:18px;padding:0 0 0 4px;line-height:1}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--bar);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--sep);padding:7px 0 calc(var(--sab) + 5px)}
.tabbar button{position:relative;flex:0 1 120px;border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0}
.tabbar button.on{color:var(--ink)}
.tabbar button.on svg{color:var(--accent)}
.tabbar svg{width:26px;height:26px}
.tabbar .dot{top:-2px;right:calc(50% - 22px)}

/* profile setup steps */
.onb{max-width:440px;margin:0 auto;padding:calc(var(--sat) + 26px) 22px calc(var(--sab) + 26px);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.onb .logo{width:64px;height:64px;border-radius:16px;margin:8px auto 18px;display:block}
.onb h1{font-size:36px;text-align:center;margin:0 0 6px;line-height:1.05}
.onb .hint{text-align:center}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 20px}
.steps i{width:30px;height:4px;border-radius:2px;background:var(--sep)}
.steps i.on{background:var(--accent)}
.field{background:var(--card);border:1px solid var(--sep);border-radius:16px;margin-bottom:12px;overflow:hidden}
.field label{display:flex;align-items:center;padding:0 16px;min-height:52px;gap:10px}
.field label+label{border-top:1px solid var(--sep)}
.field label span{width:110px;flex:none;color:var(--ink);font-weight:550;font-size:15px}
.field input,.field textarea{flex:1;border:0;background:none;padding:13px 0;outline:none;min-width:0}
.field input::placeholder{color:var(--muted);opacity:.8}
.field textarea{resize:none;height:66px}
.field .at{color:var(--muted);margin-right:-8px}
.field label span.at{width:auto;font-weight:400;color:var(--muted)}
.fnote{font-size:13px;color:var(--muted);margin:-4px 6px 14px}
.box{background:var(--card);border:1px solid var(--sep);border-radius:20px;padding:22px;text-align:center;margin-bottom:14px}
.facecirc{width:132px;height:132px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent)}
.fslots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:320px;margin:0 auto}
.fslot{position:relative;width:100%;aspect-ratio:1;align-self:start;box-sizing:border-box;border-radius:50%;background:var(--card2);overflow:visible}
.fslot.empty{border:2px dashed var(--sep);background:none;display:flex;align-items:center;justify-content:center}
.fslot img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;box-shadow:0 0 0 2px var(--accent)}
.fslot button{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:10px;line-height:20px;padding:0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite}
#scan{position:fixed;inset:0;z-index:55;background:#0B0A09;color:#F3EFE7;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:var(--sat) 24px var(--sab);text-align:center}
#scan.show{display:flex}
.sc-stage{position:relative;width:min(74vw,330px);aspect-ratio:1}
.sc-stage video{position:absolute;inset:7%;width:86%;height:86%;object-fit:cover;border-radius:50%;transform:scaleX(-1);background:#222}
.sc-stage .fl{position:absolute;inset:7%;border-radius:50%;background:#fff;opacity:0;transition:opacity .25s;pointer-events:none}
.sc-stage.flash .fl{opacity:.55;transition:none}
.sc-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sc-ring circle{fill:none;stroke:rgba(243,239,231,.18);stroke-width:3;stroke-linecap:round;transition:stroke .3s}
.sc-ring circle.on{stroke:var(--accent)}
.sc-ring circle.fill{stroke:var(--accent);transition:stroke-dasharray .15s linear}
.sc-msg{transition:opacity .15s}
.sc-arrow{position:absolute;top:50%;font-size:44px;color:#fff;opacity:0;transform:translateY(-50%);transition:opacity .2s;text-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:none}
.sc-arrow.show{opacity:.9}
.sc-arrow.left{left:-6%;animation:scl 1s ease-in-out infinite}.sc-arrow.right{right:-6%;animation:scr 1s ease-in-out infinite}
.sc-arrow.up{top:-4%;left:50%;transform:translateX(-50%);animation:scu 1s ease-in-out infinite}.sc-arrow.down{top:auto;bottom:-6%;left:50%;transform:translateX(-50%);animation:scd 1s ease-in-out infinite}
@keyframes scl{50%{margin-left:-12px}}@keyframes scr{50%{margin-right:-12px}}@keyframes scu{50%{margin-top:-12px}}@keyframes scd{50%{margin-bottom:-12px}}
.sc-msg{font:700 24px var(--display);letter-spacing:-.02em;max-width:320px;min-height:58px}
.sc-sub{color:#A39C90;font-size:15px;margin-top:-10px}
#scan .cancel{position:absolute;left:20px;top:calc(var(--sat) + 16px);border:0;background:rgba(243,239,231,.12);color:#F3EFE7;font-size:15px;font-weight:600;padding:8px 16px;border-radius:99px}
.fchoice{display:grid;gap:10px}
.fopt{position:relative;text-align:left;border:1.5px solid var(--sep);background:var(--bg);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.fopt b{font:700 19px var(--display);letter-spacing:-.015em}
.fopt span{color:var(--muted);font-size:14px}
.fopt.rec{border-color:var(--accent);background:var(--accent-soft)}
.fopt i{position:absolute;top:14px;right:14px;font-style:normal;font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:3px 8px;border-radius:99px}
.okmsg{color:var(--green);font-weight:650;margin-bottom:10px}
.err{color:var(--red);font-size:14px;margin-top:10px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);margin:4px 4px 14px;cursor:pointer;line-height:1.4}
.check input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--accent)}
.onb .grow{flex:1;min-height:12px}
.link{border:0;background:none;color:var(--link);font-size:15px;font-weight:600;padding:10px;display:block;margin:4px auto 0}
.emo{background:var(--card);border:1px solid var(--sep);border-radius:16px;margin-bottom:12px;overflow:hidden}
.emocats{display:flex;gap:4px;overflow-x:auto;padding:8px 8px 6px;border-bottom:1px solid var(--sep);scrollbar-width:none}
.emocats::-webkit-scrollbar{display:none}
.emocats button{flex:none;border:0;background:none;border-radius:99px;padding:5px 10px 5px 7px;font-size:17px;display:flex;align-items:center;gap:5px;color:var(--muted)}
.emocats button span{font-size:12px;font-weight:650}
.emocats button.on{background:var(--ink);color:var(--bg)}
.emo .emojis{border:0;border-radius:0;margin:0;max-height:236px;overflow-y:auto}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px;background:var(--card);border:1px solid var(--sep);border-radius:16px;margin-bottom:12px}
.emojis button{border:0;background:none;font-size:26px;aspect-ratio:1;border-radius:12px;padding:0;line-height:1}
.emojis button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.avpick{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.avpick img{width:112px;height:112px;border-radius:50%;object-fit:cover}
.icopick{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.icopick .sq{width:64px;height:64px;border-radius:18px;font-size:30px}

/* ---------- Firebase ---------- */

const col = n => F.collection(db, 'inframe_' + n);
const ref = (n, id) => F.doc(db, 'inframe_' + n, id);
async function initFirebase(){
  const [app, fs, au] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'),
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
  ]);
  F = fs; A = au;
  const a = app.initializeApp(FB_CONFIG);
  try { db = fs.initializeFirestore(a, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}); }
  catch { db = fs.getFirestore(a); }
  try {
    // Remember the sign-in on this device (saved in two places so iPhone home-screen apps don't forget it).
    try { AUTH = au.initializeAuth(a, {persistence:[au.indexedDBLocalPersistence, au.browserLocalPersistence], popupRedirectResolver:au.browserPopupRedirectResolver}); }
    catch { AUTH = au.getAuth(a); }
    navigator.storage?.persist?.().catch(() => {});
    // Never let a slow or blocked sign-in check hold up the app for long.
    await Promise.race([new Promise(r => { const off = au.onAuthStateChanged(AUTH, () => { off(); r(); }); }), new Promise(r => setTimeout(r, 9000))]);
    au.onAuthStateChanged(AUTH, u => { if (booted && (u?.uid || null) !== routedUid) routeAuth(); });
  } catch (e){ console.warn('auth unavailable', e); AUTH = null; }
}

}

// Decide which profile to open for whoever is signed in.
async function routeAuth(){
  const u = AUTH?.currentUser; routedUid = u?.uid || null;
  if (!u){ setMe(null); localStorage.removeItem('inframe_viewas'); authScreen = 'welcome'; return start(); }
  if (u.email === ADMIN_EMAIL && u.providerData.some(p => p.providerId === 'google.com')){
    try { return await finishAdmin(u); } catch (e){ console.warn(e); }
  }
  let s = null; try { s = await F.getDoc(ref('users', u.uid)); } catch (e){ console.warn(e); }

  else { stopAll(); setMe(null); su = {step:1, first:'', last:'', username:''}; $('#app').innerHTML = ''; renderSignup(); } // signed in, profile not made yet
}

  'auth/invalid-credential':'Email or password is incorrect.', 'auth/wrong-password':'Email or password is incorrect.', 'auth/user-not-found':'Email or password is incorrect.',
  'auth/invalid-email':"That email address doesn't look right.", 'auth/missing-password':'Enter your password.',

/* Username log-in: Firebase signs in by email, so each username keeps a small record holding the
   email encrypted with that person's password. Without the right password the email can't be read. */
let pendingPw = null; // kept in memory only, just long enough to write the username record
const b64 = u8 => btoa(String.fromCharCode(...u8)), unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function pwKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
async function saveLoginRecord(username, email, pw){
  try {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), key = await pwKey(pw, salt);
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(email)));
    await F.setDoc(ref('logins', username), {uid:AUTH.currentUser.uid, salt:b64(salt), iv:b64(iv), ct:b64(ct)});
  } catch (e){ console.warn('username login record', e); }
}
async function emailForUsername(name, pw){
  const s = await F.getDoc(ref('logins', name)); if (!s.exists()) return null;
  const d = s.data();
  try { const key = await pwKey(pw, unb64(d.salt)); return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(d.iv)}, key, unb64(d.ct))); }
  catch { return false; }
}
async function doLogin(){
  const who = $('#au-email').value.trim(), pw = $('#au-pw').value;
  if (!who) return toast('Enter your email or username.');
  if (!pw) return toast('Enter your password.');
  const b = $('#au-go'); b.disabled = true;
  try {
    let email = who;
    if (!/@.+\./.test(who)){ // no "@something.com", so treat it as a username
      const e = await emailForUsername(cleanUsername(who), pw);
      if (e === null){ b.disabled = false; return toast("We couldn't find that username. Try your email, or Continue With Google."); }
      if (e === false){ b.disabled = false; return wrongPw("Username or password is incorrect. If you just reset your password, log in with your email this one time."); }
      email = e;
    }
    pendingPw = pw;
    await A.signInWithEmailAndPassword(AUTH, email, pw);
  } catch (e){ pendingPw = null; if (['auth/invalid-credential', 'auth/wrong-password', 'auth/invalid-login-credentials'].includes(e?.code)) wrongPw('Email or password is incorrect.'); else authErr(e); }
  b.disabled = false;
}

async function admDeleteThing(kind, id){
  const t = (kind === 'group' ? ADM.groups : ADM.events).find(x => x.id === id);
  if (!confirm(`Delete ${t.name} and all of its photos for everyone? This can't be undone.`)) return;
  busy('Deleting…');
  try {
    const eids = kind === 'group' ? (await F.getDocs(F.query(col('events'), F.where('groupId', '==', id)))).docs.map(d => d.id) : [id], ops = [];
    for (let i = 0; i < eids.length; i += 30){
      const chunk = eids.slice(i, i + 30);

function drawRing(done, part){
  const C = 2 * Math.PI * 47, seg = C / 5;
  $('#sc-ring').innerHTML = Array.from({length:5}, (_, i) => `<circle cx="50" cy="50" r="47" class="${i < done ? 'on' : ''}" stroke-dasharray="${seg - 5} ${C}" stroke-dashoffset="${-i * seg}"/>`).join('')
    + (part > 0 && done < 5 ? `<circle cx="50" cy="50" r="47" class="fill" stroke-dasharray="${(seg - 5) * Math.min(1, part)} ${C}" stroke-dashoffset="${-done * seg}"/>` : '');
}
async function startScan(){
  if (!window.faceapi || !faceapi.nets.faceRecognitionNet.isLoaded) toast('Loading the face scanner, one sec…');
  try { await ensureModels(); if (!faceapi.nets.tinyFaceDetector.isLoaded) await faceapi.nets.tinyFaceDetector.loadFromUri(FACEAPI + 'model/'); } catch (e){ return toast(typeof e === 'string' ? e : 'Could not load the face scanner. Check your connection.'); }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:720}, height:{ideal:720}}}); }
  catch { return toast('Camera not available. Allow camera access for InFrame in Settings, then try again.'); }
  pushNav(); $('#scan').classList.add('show');
  const v = $('#scan-v'); v.srcObject = stream; try { await Promise.race([v.play(), new Promise(r => setTimeout(r, 1500))]); } catch {}
  /* A fast tracker follows your head live; each shot is only taken once you're really in the pose and hold it briefly (never on a timer).
     The preview is mirrored, so "left" means toward the left side of the screen. */
  const steps = [
    ['straight', 'Look straight at the camera', '', 0, 0],
    ['left', 'Slowly turn your head left', '←', -14, 0],
    ['right', 'Now slowly turn right', '→', 14, 0],
    ['up', 'Tilt your chin up a little', '↑', 0, -14],
    ['down', 'Now tilt your chin down', '↓', 0, 14],
  ];
  const HOLD = 4, TURN = .17, TILT = .07;
  const got = [], c = document.createElement('canvas'), me_ = scanning = {stream, stop:false};
  const tiny = new faceapi.TinyFaceDetectorOptions({inputSize:256, scoreThreshold:.45});
  let lastMsg = '', pendMsg = '', pendN = 0;
  // only change the words once the same hint shows twice in a row, so it doesn't flicker
  const say = (m, sub, now) => { if (m !== lastMsg){ if (!now && m !== pendMsg){ pendMsg = m; pendN = 1; return; } if (!now && ++pendN < 2) return; lastMsg = m; $('#scan-msg').textContent = m; } $('#scan-sub').textContent = sub; };
  const arrow = i => { const a = $('#sc-arrow'), st = steps[i]; if (!a) return; a.textContent = st?.[2] || ''; a.className = 'sc-arrow' + (st?.[2] ? ' show ' + st[0] : ''); };
  let i = 0, stepStart = Date.now(), basePitch = null, held = 0, best = null;
  const ask = extra => say(steps[i][1], extra || `${i + 1} of 5`, true);
  drawRing(0, 0); ask(); arrow(0);
  while (!me_.stop && i < steps.length){
    await new Promise(r => requestAnimationFrame(r));
    $('#scan-skip').style.display = i > 0 && Date.now() - stepStart > 7000 ? '' : 'none';
    if (me_.skip){ me_.skip = false; i++; held = 0; best = null; drawRing(i, 0); stepStart = Date.now(); if (i < steps.length){ ask(); arrow(i); } continue; }
    if (!v.videoWidth) continue;
    const k = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight)); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    const x = c.getContext('2d'); x.setTransform(-1, 0, 0, 1, c.width, 0); x.drawImage(v, 0, 0, c.width, c.height); x.setTransform(1, 0, 0, 1, 0, 0);
    let f; try { f = await faceapi.detectSingleFace(c, tiny).withFaceLandmarks(); } catch { continue; }
    if (me_.stop) break;
    const miss = m => { held = 0; best = null; drawRing(i, 0); say(m, `${i + 1} of 5`); };
    if (!f){ miss('Put your face inside the circle'); continue; }
    const box = f.detection.box, cx = (box.x + box.width / 2) / c.width, cy = (box.y + box.height / 2) / c.height;
    if (box.width < c.width * .16){ miss('Move a little closer'); continue; }
    if (box.width > c.width * .8){ miss('Move back a little'); continue; }
    if (Math.abs(cx - .5) > .24 || Math.abs(cy - .5) > .27){ miss('Center your face in the circle'); continue; }
    const pose = headPose(f.landmarks), kind = steps[i][0], yaw = pose.yaw, tilt = basePitch == null ? 0 : pose.pitch - basePitch;
    let ok = false, hint = '';
    if (kind === 'straight'){ ok = Math.abs(yaw) < .08; hint = 'Face the camera straight on'; }
    else if (kind === 'left' || kind === 'right'){
      const want = kind === 'left' ? -1 : 1, amt = yaw * want;
      ok = amt > TURN && Math.abs(tilt) < .16;
      hint = amt < -.05 ? `Other way ${steps[i][2]}` : amt > TURN * .45 ? `A little further ${steps[i][2]}` : '';
    } else {
      const want = kind === 'up' ? -1 : 1, amt = tilt * want;
      ok = amt > TILT && Math.abs(yaw) < .15;
      hint = Math.abs(yaw) >= .15 ? 'Keep your face pointed at the camera' : amt < -.03 ? `Other way ${steps[i][2]}` : amt > TILT * .45 ? `A little more ${steps[i][2]}` : '';
    }
    if (!ok){ held = 0; best = null; drawRing(i, 0); say(hint || steps[i][1], Date.now() - stepStart > 8000 ? 'Take your time. It snaps when you get there.' : `${i + 1} of 5`); continue; }
    held++; drawRing(i, held / HOLD);
    if (!best || f.detection.score > best.score){ const snap = document.createElement('canvas'); snap.width = c.width; snap.height = c.height; snap.getContext('2d').drawImage(c, 0, 0); best = {snap, box, score:f.detection.score, pitch:pose.pitch}; }
    if (held < HOLD){ say('Hold still…', `${i + 1} of 5`, true); continue; }
    // got the pose: read the face template from the best frame (the detailed check runs only here, so the live view stays smooth)
    let d; try { d = await faceapi.detectSingleFace(best.snap, new faceapi.SsdMobilenetv1Options({minConfidence:.4})).withFaceLandmarks().withFaceDescriptor(); } catch {}
    if (!d){ held = 0; best = null; drawRing(i, 0); continue; }
    if (kind === 'straight') basePitch = best.pitch;
    got.push({descriptor:Array.from(d.descriptor), thumb:squareCrop(best.snap, 240, d.detection.box)});
    i++; held = 0; best = null; drawRing(i, 0); stepStart = Date.now();
    const st = $('#sc-stage'); st.classList.add('flash'); setTimeout(() => st.classList.remove('flash'), 120);
    try { navigator.vibrate?.(30); } catch {}
    if (i < steps.length){ ask(); arrow(i); }
  }
  arrow(99);
  const finished = !me_.stop; stopScan(); $('#scan-skip').style.display = 'none';
  if (got.length){ faces = got.slice(0, MAX_SELFIES); drawFaces(); toast(finished && got.length === 5 ? 'Face scan done.' : `Face scan saved with ${plural(got.length, 'angle')}.`); }
}
function stopScan(){
  if (scanning){ scanning.stop = true; scanning.stream.getTracks().forEach(t => t.stop()); scanning = null; }
  $('#scan').classList.remove('show'); $('#scan-v').srcObject = null;
}
// what gets saved on the profile
function faceFields(){ return {descriptor:faces[0].descriptor, faceThumb:faces[0].thumb, faceSet:faces.map(f => ({v:f.descriptor})), faceThumbs:faces.map(f => f.thumb)}; }

let pickedEmoji = '', pickedIcon = null;

async function setIconFrom(f){ try { const c = await toCanvas(f, 1200); busy('Checking…'); const bad = await isNude(c).finally(() => busy()); if (bad) return toast(NUDE_MSG); pickedIcon = squareCrop(c, 240); $('#icoprev').innerHTML = `<img src="${pickedIcon}" alt="">`; $('#icorm').style.display = ''; } catch (e){ toast(e); } }
// Emoji picker with category tabs. emoCb (optional) gets the tapped emoji instead of selecting it (used for reactions).
let emoCb = null;
function emojiGrid(sel, cb){
  pickedEmoji = sel || ''; emoCb = cb || null;
  const ci = Math.max(0, EMOJI_CATS.findIndex(c => c[1].includes(sel)));
  return `<div class="emo"><div class="emocats">${EMOJI_CATS.map((c, i) => `<button class="${i === ci ? 'on' : ''}" onclick="emoCat(this,${i})" aria-label="${c[0]}">${c[1][0]}<span>${c[0]}</span></button>`).join('')}</div>
    <div class="emojis">${emoCells(ci, sel)}</div></div>`;
}
const emoCells = (ci, sel) => EMOJI_CATS[ci][1].map(e => `<button class="${e === sel ? 'on' : ''}" onclick="pickEmoji(this,'${e}')">${e}</button>`).join('');
function emoCat(btn, i){
  const w = btn.closest('.emo'); w.querySelectorAll('.emocats button').forEach((b, k) => b.classList.toggle('on', k === i));
  const g = w.querySelector('.emojis'); g.innerHTML = emoCells(i, pickedEmoji); g.scrollTop = 0;

function pickEmoji(btn, e){ if (!emoCb && $('#icoprev')){ pickedIcon = null; $('#icoprev').textContent = e; const r = $('#icorm'); if (r) r.style.display = 'none'; } return pickEmoji_(btn, e); }
function pickEmoji_(btn, e){
  if (emoCb) return emoCb(e);
  const on = pickedEmoji === e; btn.closest('.emo').querySelectorAll('.emojis button').forEach(b => b.classList.remove('on')); pickedEmoji = on ? '' : e; if (!on) btn.classList.add('on');
}
// A random cartoon avatar (an animal on a soft color) so nobody's face scan becomes their profile picture.
const AV_EMOJI = ['🐶','🐱','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐧','🐦','🦉','🐙','🦄','🐝','🐢','🐬','🦋','🐰','🐹','🦒','🦘','🦦','🐳','🦩','🐿️','🦔'];
const AV_BG = [['#FFD6A5','#FFB27A'],['#CDEAC0','#9ED8A0'],['#BDE0FE','#8EC5FC'],['#E4C1F9','#C49BF0'],['#FFC8DD','#FF9EBB'],['#FDFFB6','#F5E37A'],['#A0E7E5','#6FD3D0'],['#FFCFD2','#F7A1A6'],['#D0F4DE','#A7E3BD'],['#E2ECE9','#BFD8D2']];
function randomAvatar(){
  const c = document.createElement('canvas'); c.width = c.height = 320; const x = c.getContext('2d');
  const [a, b] = AV_BG[Math.floor(Math.random() * AV_BG.length)], g = x.createLinearGradient(0, 0, 320, 320);
  g.addColorStop(0, a); g.addColorStop(1, b); x.fillStyle = g; x.fillRect(0, 0, 320, 320);
  x.font = '170px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';

function shuffleAvatar(){ pickedAvatar = randomAvatar(); const i = $('#avimg'); if (i) i.src = pickedAvatar; }
function blankAvatar(){ return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#e5e5ea"/><circle cx="50" cy="40" r="18" fill="#aeaeb2"/><path d="M18 92c4-18 17-28 32-28s28 10 32 28" fill="#aeaeb2"/></svg>'); }

/* ---------- usernames ---------- */
const cleanUsername = s => s.trim().toLowerCase().replace(/^@/, '');
function usernameProblem(u){ if (!/^[a-z0-9._]{3,20}$/.test(u)) return 'Usernames are 3–20 letters, numbers, dots or underscores.'; return null; }
async function claimUsername(name, userId, old){
  await F.runTransaction(db, async t => {
    const r = ref('usernames', name), s = await t.get(r);
    if (s.exists() && s.data().userId !== userId) throw 'That username is taken.';
    t.set(r, {userId});
    if (old && old !== name) t.delete(ref('usernames', old));
  });
}

/* ---------- signup (3 steps) ---------- */
let su = {step:1, first:'', last:'', username:''};
function inviteBannerHTML(){ return sessionStorage.getItem('inframe_join') ? `<div class="callout" id="invb"><img src="${ICON}" alt=""><div>You've been invited to share photos on InFrame. Make your profile to join.</div></div>` : ''; }
function renderSignup(){
  const steps = `<div class="steps">${[1,2,3].map(n => `<i class="${n <= su.step ? 'on' : ''}"></i>`).join('')}</div>`;
  let body = '';
  if (su.step === 1) body = `
    <img class="logo" src="icon-192.png" alt="">
    <h1>Your Profile</h1><p class="hint">Tell your friends who you are.</p>
    ${inviteBannerHTML()}${steps}
    <div class="field">
      <label><span>First Name</span><input id="su-first" value="${esc(su.first)}" autocomplete="given-name" placeholder="Required"></label>
      <label><span>Last Initial</span><input id="su-last" value="${esc(su.last)}" maxlength="1" placeholder="Required" oninput="this.value=this.value.replace(/[^a-z]/gi,'').toUpperCase()"></label>
      <label><span>Username</span><span class="at">@</span><input id="su-user" value="${esc(su.username)}" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="yourname"></label>
    </div>
    <div class="fnote">Friends see your first name, last initial and username.</div>
    <div class="grow"></div>
    <button class="btn fill full" onclick="suNext1()">Continue</button>
    <button class="link" onclick="logOut()">Log Out</button>`;
  if (su.step === 2) body = `
    <h1>Face Scan</h1><p class="hint">A quick scan so InFrame can find you in friends' photos. It's only used for matching and never posted.</p>${steps}
    <div class="box" id="facebox">${faceGrid()}</div>
    <label class="check"><input type="checkbox" id="su-bio"><span>I agree that InFrame may create a face template from my selfies and use it only to find me in photos shared in my groups and events. It will never be sold or used to train or test AI. See the <a href="terms.html#biometric" target="_blank">Biometric Data Policy</a>.</span></label>
    <div class="grow"></div>
    <button class="btn fill full" onclick="suNext2()">Continue</button>
    <button class="link" onclick="su.step=1;renderSignup()">Back</button>`;
  if (su.step === 3) body = `
    <h1>Your Look</h1><p class="hint">Here's a random avatar to start. Shuffle it, or use your own photo any time.</p>${steps}
    ${avatarPicker(pickedAvatar || (pickedAvatar = randomAvatar()), null)}
    <div class="sechead" style="margin-top:0">Your Emoji</div>${emojiGrid(pickedEmoji)}
    <div class="sechead" style="margin-top:6px">About You</div><div class="field"><label class="tall"><textarea id="su-bioline" maxlength="300" rows="3" placeholder="A few lines about you. Optional."></textarea></label></div>
    <label class="check"><input type="checkbox" id="su-terms"><span>I agree to the <a href="terms.html" target="_blank">Terms of Service and Privacy Policy</a>.</span></label>
    <div class="grow"></div>
    <button class="btn fill full" id="su-go" onclick="suCreate()">Create Account</button>
    <button class="link" onclick="su.step=2;renderSignup()">Back</button>`;
  $('#app').innerHTML = `<div class="onb" id="signup">${body}</div>`;
  window.scrollTo(0, 0);
}
async function suNext1(){
  su.first = $('#su-first').value.trim(); su.last = $('#su-last').value.trim().toUpperCase(); su.username = cleanUsername($('#su-user').value);
  if (!su.first) return toast('Enter your first name.');
  if (!/^[A-Z]$/.test(su.last)) return toast('Enter the first letter of your last name.');
  const p = usernameProblem(su.username); if (p) return toast(p);
  if (blockText(su.first, su.username)) return;
  const s = await F.getDoc(ref('usernames', su.username));
  if (s.exists()) return toast('That username is taken.');
  su.step = 2; renderSignup();
}
function suNext2(){
  if (!faces.length){ $('#facebox')?.scrollIntoView({behavior:'smooth', block:'center'}); return toast('Do the face scan first.'); }
  if (!$('#su-bio').checked){ const l = $('#su-bio').closest('label'); l.scrollIntoView({behavior:'smooth', block:'center'}); l.style.outline = '2px solid var(--accent)'; l.style.borderRadius = '12px'; return toast('Tick the box above Continue to agree to face matching.'); }
  su.bioConsent = Date.now(); su.step = 3; renderSignup();
}
async function suCreate(){
  if (!$('#su-terms').checked) return toast('Please agree to the Terms to continue.');
  if (blockText($('#su-bioline').value)) return;
  const btn = $('#su-go'); btn.disabled = true;
  if (!AUTH?.currentUser){ btn.disabled = false; return showAuth('signup'); }
  const id = AUTH.currentUser.uid;
  try {
    await claimUsername(su.username, id);
    if (pendingPw){ await saveLoginRecord(su.username, AUTH.currentUser.email, pendingPw); pendingPw = null; }
    const now = Date.now();
    await F.setDoc(ref('users', id), {
      isAdmin:false,
      first:su.first[0].toUpperCase() + su.first.slice(1), last:su.last, username:su.username,
      avatar:pickedAvatar || randomAvatar(), emoji:pickedEmoji, bio:$('#su-bioline').value.trim(),
      ...faceFields(),
      termsVersion:TERMS_VERSION, termsAcceptedAt:now, biometricConsentAt:su.bioConsent, createdAt:now,
    });
    faces = []; pickedAvatar = null; pickedEmoji = ''; su = {step:1, first:'', last:'', username:''};
    setMe(id); start(); toast('Welcome to InFrame!');
  } catch (e){ btn.disabled = false; toast(typeof e === 'string' ? e : 'Something went wrong. Try again.'); if (e === 'That username is taken.'){ su.step = 1; renderSignup(); } }
}

/* ---------- navigation ---------- */
let view = {name:'tab', tab:'groups'}, stack = [];
function tab(t){ stack = []; view = {name:'tab', tab:t}; render(); window.scrollTo(0, 0); if (t === 'alerts') markAllRead(); }
// Phone back button / swipe-back closes what's open, then steps back a screen.
function pushNav(){ try { history.pushState({inframe:1}, ''); } catch {} }
addEventListener('popstate', () => {
  if ($('#scan').classList.contains('show')) return stopScan();
  if ($('#cam').classList.contains('show')) return closeCamera();
  if ($('#viewer').classList.contains('show')) return closeViewer();
  if ($('#dim')) return closeSheet();
  if (stack.length) back();
});
function go(v){ pushNav(); stack.push({view, y:scrollY}); view = {...v, at:Date.now()}; render(); window.scrollTo(0, 0); if (v.name === 'alerts') setTimeout(markAllRead, 600); }
function back(){ const p = stack.pop(); view = p ? p.view : {name:'tab', tab:'groups'}; render(); window.scrollTo(0, p ? p.y : 0); }
let renderQueued = false;
function later(){ if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

/* ---------- sheets ---------- */
function openSheet(html){
  if (!$('#dim')) pushNav();
  closeSheet(true);
  const d = document.createElement('div'); d.className = 'dim'; d.id = 'dim';
  d.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  d.addEventListener('click', e => { if (e.target === d) closeSheet(); });
  document.body.appendChild(d); requestAnimationFrame(() => d.classList.add('show'));
  document.body.style.overflow = 'hidden';
}
function closeSheet(instant){
  const d = $('#dim'); if (!d) return; document.body.style.overflow = '';
  if (instant === true) return d.remove();
  d.classList.remove('show'); setTimeout(() => d.remove(), 280);
}
const sheetHead = (title, done, fn) => `<div class="shh"><button onclick="closeSheet()">Cancel</button><div class="ttl">${title}</div>${done ? `<button class="done" onclick="${fn}">${done}</button>` : '<span style="min-width:60px"></span>'}</div>`;

const isVid = f => /^video\//.test(f.type) || /\.(mov|mp4|m4v|webm|3gp)$/i.test(f.name);
async function upload(eid, list){
  const files = [...list]; if (!files.length) return;
  const e = evt(eid); if (!e) return toast("Couldn't find that event.");
  const ac = files.some(isVid) ? audioCtx() : null;   // made right away, while the tap still counts, so video sound records
  try { await ensureModels(); busy('Loading Safety Check…'); await ensureNsfw(); } catch (err){ busy(); return toast(typeof err === 'string' ? err : "Couldn't load the safety check. Check your connection."); }
  const members = await membersWithFaces(e), perUser = {};
  let done = 0, vids = 0, uncat = 0, failed = 0, cut = 0, blocked = 0, errMsg = '';
  for (const f of files){
    const n = `${done + failed + 1} of ${files.length}`;
    try {
      const r = F.doc(col('photos')), b = F.writeBatch(db), now = Date.now();
      let doc, faces, full;
      if (isVid(f)){
        const out = await prepVideo(f, members, ac, pct => busy(`Getting Video ${n} Ready… ${pct}%`));

        out.parts.forEach((bytes, k) => b.set(ref('vchunks', `${r.id}_${k}`), {photoId:r.id, eventId:eid, i:k, data:F.Bytes.fromUint8Array(bytes)}));
        vids++;
      } else {
        busy(`Scanning Photo ${n}…`);
        const c = await toCanvas(f, 3024), dc = shrinkCanvas(c, 1600);
        if (await isNude(dc)) throw 'NUDE';
        const dets = await detect(dc); faces = assign(dets, dc, members);
        const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .9)), bytes = new Uint8Array(await blob.arrayBuffer()), parts = [];
        for (let k = 0; k < bytes.length; k += PIECE) parts.push(bytes.subarray(k, k + PIECE));
        parts.forEach((part, k) => b.set(ref('vchunks', `${r.id}_${k}`), {photoId:r.id, eventId:eid, i:k, data:F.Bytes.fromUint8Array(part)}));
        full = URL.createObjectURL(blob);
        doc = {w:c.width, h:c.height, thumb:shrink(c, 640, .8), vparts:parts.length, vmime:'image/jpeg'};
      }
      busy(`Uploading ${n}…`);
      const matched = [...new Set(faces.filter(x => x.matchId).map(x => x.matchId))];
      b.set(r, {...doc, eventId:eid, uploaderId:ME, faces, matched, notMe:[], reactions:{}, createdAt:now});
      if (doc.kind === 'video') b.set(ref('images', r.id), {data:full, eventId:eid});
      matched.forEach(u => { const own = u === ME;   // you took it, so it's already yours: no Keep/Skip review
        b.set(ref('deliveries', `${r.id}_${u}`), {photoId:r.id, eventId:eid, userId:u, uploaderId:ME, status:own ? 'approved' : 'pending', via:own ? 'own' : 'face', at:now});
        if (!own) perUser[u] = (perUser[u] || 0) + 1; });
      await b.commit(); fullCache.set(r.id, full);
      if (isUncat({faces})) uncat++; done++;
    } catch (err){ console.warn(err); if (err === 'NUDE') blocked++; else { failed++; if (typeof err === 'string') errMsg = err; } }
  }
  busy(); ac?.close?.().catch(() => {});
  const photos = done - vids, what = [photos && plural(photos, 'photo'), vids && plural(vids, 'video')].filter(Boolean).join(' and ') || 'nothing';
  // Uploading to an event answers any photo requests you had for it.
  const answered = Object.values(C.reqIn).filter(r => r.eventId === eid && r.status === 'open');
  if (done && answered.length){
    const b = F.writeBatch(db); answered.forEach(r => b.update(ref('requests', r.id), {status:'done', doneAt:Date.now(), count:done})); await b.commit();
    answered.forEach(r => notify([r.fromId], `${handle(ME)} uploaded ${what} from ${e.name} like you asked`, {v:'event', id:eid, seg:'mine'}));
  }
  for (const [u, n] of Object.entries(perUser)) notify([u], `${handle(ME)} added ${plural(n, 'photo')} of you from ${e.name}`, {v:'inbox'});
  if (uncat) notify(eventMembers(e), `${plural(uncat, 'new photo')} in ${e.name} ${uncat === 1 ? 'was' : 'were'} added to the Shared Album`, {v:'event', id:eid, seg:'all'});
  const sent = Object.values(perUser).reduce((a, b) => a + b, 0);
  toast(done ? `Added ${what}${sent ? ` · sent to ${plural(Object.keys(perUser).length, 'person', 'people')}` : ''}${uncat ? ` · ${uncat} to claim` : ''}${cut ? ` · videos keep the first ${MAX_CLIP} seconds` : ''}${failed ? ` · ${failed} failed` : ''}${blocked ? ` · ${blocked} blocked for nudity` : ''}`
    : blocked ? `${plural(blocked, 'upload')} blocked. InFrame doesn't allow nudity.` : (errMsg || "Couldn't upload those. Try again."));
  if (done && !(view.name === 'event' && view.id === eid)) go({name:'event', id:eid, seg:'uploads'});
  else if (done && view.name === 'event'){ view.seg = 'uploads'; render(); }
}

/* ---------- short videos (free plan: first 15 seconds, shrunk to ~720p, saved in small pieces) ---------- */
const MAX_CLIP = 15, PIECE = 900 * 1024, MAX_VIDEO_BYTES = 7 * 1024 * 1024;
let _ac = null;
function audioCtx(){ try { _ac = new (window.AudioContext || window.webkitAudioContext)(); _ac.resume?.(); return _ac; } catch { return null; } }
function openVideo(file){
  return new Promise((res, rej) => {
    const v = document.createElement('video'), url = URL.createObjectURL(file);
    v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto'; v.crossOrigin = 'anonymous';
    v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none'; document.body.appendChild(v);   // iPhone keeps playing it smoothly when it's on the page
    v.onloadeddata = () => res({v, url}); v.onerror = () => rej("Couldn't open that video. Try a .mp4 or .mov.");
    setTimeout(() => rej("That video took too long to open."), 20000); v.src = url; v.load();
  });
}
const seekTo = (v, t) => new Promise(r => { let ok = false; const done = () => { if (ok) return; ok = true; v.removeEventListener('seeked', done); r(); }; v.addEventListener('seeked', done); v.currentTime = t; setTimeout(done, 2500); });
function vFrame(v, max){ const s = Math.min(1, max / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); return c; }
async function prepVideo(file, members, ac, prog){
  if (!window.MediaRecorder) throw "This browser can't upload videos. Try Safari or Chrome.";
  const {v, url} = await openVideo(file);
  try {
    try { await v.play(); v.pause(); } catch {}               // iPhone needs this before frames can be read
    const full = isFinite(v.duration) ? v.duration : MAX_CLIP, dur = Math.min(full, MAX_CLIP);
    prog(0);
    // 1) look for faces at a few moments in the clip
    let bestFaces = [], extra = new Set(), poster = null, thumb = null;
    for (const t of [.08, .35, .62, .9].map(x => x * dur)){
      await seekTo(v, t); const c = vFrame(v, 960);
      if (await isNude(c)) throw 'NUDE';
      if (!poster){ poster = shrink(c, 1280, .8); thumb = shrink(c, 420, .72); }
      const fs = assign(await detect(c), c, members);
      fs.forEach(x => x.matchId && extra.add(x.matchId));
      if (fs.length > bestFaces.length){ bestFaces = fs; poster = shrink(c, 1280, .8); thumb = shrink(c, 420, .72); }
    }
    const faces = bestFaces.slice(); faces.forEach(x => x.matchId && extra.delete(x.matchId));
    extra.forEach(id => faces.push({box:null, matchId:id}));   // seen in another moment of the clip
    // 2) re-record the clip smaller (plays through once in the background, so it takes about as long as the clip)
    await seekTo(v, 0);
    const s = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight)), cv = document.createElement('canvas');
    cv.width = Math.round(v.videoWidth * s / 2) * 2; cv.height = Math.round(v.videoHeight * s / 2) * 2;
    const ctx = cv.getContext('2d'), stream = cv.captureStream(30);
    if (ac){ try { const src = ac.createMediaElementSource(v), dst = ac.createMediaStreamDestination(); src.connect(dst); dst.stream.getAudioTracks().forEach(t => stream.addTrack(t)); v.muted = false; } catch (e){ console.warn('no audio', e); } }
    const mime = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';

    const bits = []; rec.ondataavailable = ev => ev.data.size && bits.push(ev.data);

    ctx.drawImage(v, 0, 0, cv.width, cv.height); rec.start(500);
    try { await v.play(); } catch { v.muted = true; await v.play(); }
    await new Promise(r => {
      const tick = () => { ctx.drawImage(v, 0, 0, cv.width, cv.height); prog(Math.min(99, Math.round(v.currentTime / dur * 100)));

    });

    const all = new Uint8Array(await blob.arrayBuffer()), parts = [];

}
// Load a video's pieces and join them back into a playable file.
const vidCache = new Map();
async function getVideo(p){
  if (!vidCache.has(p.id)) vidCache.set(p.id, (async () => {
    const s = await F.getDocs(F.query(col('vchunks'), F.where('photoId', '==', p.id)));
    const parts = s.docs.map(d => d.data()).sort((a, b) => a.i - b.i).map(d => d.data.toUint8Array());
    if (!parts.length) throw 'missing';
    return URL.createObjectURL(new Blob(parts, {type:p.vmime || 'video/mp4'}));
  })().catch(e => { vidCache.delete(p.id); throw e; }));

}

// After you join (or update your selfie), look through earlier photos for faces nobody was matched to.
async function rescanForMe(eids){
  const u = me() || (await F.getDoc(ref('users', ME))).data(); if (!userDescs(u).length || !eids.length) return;
  let photos = [];
  for (let i = 0; i < eids.length; i += 30){ const s = await F.getDocs(F.query(col('photos'), F.where('eventId', 'in', eids.slice(i, i + 30)))); photos.push(...s.docs.map(d => ({id:d.id, ...d.data()}))); }
  photos = photos.filter(p => p.faces?.some(f => !f.matchId) && !(p.notMe || []).includes(ME) && !(p.matched || []).includes(ME));
  if (!photos.length) return;
  try { await ensureModels(); } catch (e){ return; }
  let n = 0, found = 0; const byUp = {};
  for (const p of photos){
    busy(`Looking For You In Earlier Photos ${++n}/${photos.length}…`);
    try {
      const data = await getFull(p.id, p); if (!data) continue;
      const c = await toCanvas(data, 1600), dets = await detect(c); let best = null;
      dets.forEach(d => { const dist = faceDist(d.descriptor, u); if (dist < MATCH && (!best || dist < best.dist)) best = {d, dist}; });
      if (!best) continue;
      const box = relBox(best.d, c); let idx = -1, bi = .3;
      p.faces.forEach((f, i) => { if (f.matchId) return; const v = iou(f.box, box); if (v > bi){ bi = v; idx = i; } });
      if (idx < 0) continue;
      const b = F.writeBatch(db);
      b.update(ref('photos', p.id), {faces:p.faces.map((f, i) => i === idx ? {...f, matchId:ME} : f), matched:F.arrayUnion(ME)});
      b.set(ref('deliveries', `${p.id}_${ME}`), {photoId:p.id, eventId:p.eventId, userId:ME, uploaderId:p.uploaderId, status:'pending', via:'face', at:Date.now()});
      await b.commit(); found++; (byUp[p.uploaderId] = byUp[p.uploaderId] || []).push(p);
    } catch (e){ console.warn(e); }
  }
  busy(); if (!found) return;
  toast(`Found you in ${plural(found, 'earlier photo')}. Check your Inbox.`);
  // a notification for you (from whoever posted them), and a heads-up to each poster
  const b = F.writeBatch(db), now = Date.now();
  for (const [up, ps] of Object.entries(byUp)){
    if (up !== ME) b.set(F.doc(col('notifications')), {userId:ME, fromId:up, text:`${handle(up)} already posted ${plural(ps.length, 'photo')} of you from ${evt(ps[0].eventId)?.name || 'an event'}. They're in your Inbox.`, link:{v:'inbox'}, read:false, at:now});
  }
  await b.commit().catch(() => {});
  Object.entries(byUp).forEach(([up, ps]) => notify([up], `${handle(ME)} just joined and was found in ${ps.length === 1 ? 'one of your photos' : ps.length + ' of your photos'}`, {v:'event', id:ps[0].eventId, seg:'all'}));
}

// Pinch to zoom, drag to look around, double-tap to zoom. When not zoomed, the photo follows your finger and slides to the next one.
let vZoomed = false, vEnter = 0;
function zoomable(area, isVideo){
  const w = area.querySelector('.vwrap'); if (!w) return;
  let z = 1, x = 0, y = 0, start = null, multi = false, lastTap = 0, swipe = null;
  const apply = anim => { w.style.transition = anim ? 'transform .25s cubic-bezier(.2,.8,.2,1)' : 'none'; w.style.transform = `translate(${x}px,${y}px) scale(${z})`; vZoomed = z > 1; };
  const clamp = () => { const bw = w.offsetWidth, bh = w.offsetHeight, mx = Math.max(0, (bw * z - area.clientWidth) / 2), my = Math.max(0, (bh * z - area.clientHeight) / 2); x = Math.max(-mx, Math.min(mx, x)); y = Math.max(-my, Math.min(my, y)); };
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  if (vEnter){ x = vEnter * area.clientWidth * .6; apply(); w.style.opacity = '.4'; requestAnimationFrame(() => requestAnimationFrame(() => { x = 0; w.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s'; w.style.opacity = '1'; w.style.transform = 'translate(0,0) scale(1)'; })); vEnter = 0; }
  area.addEventListener('touchstart', ev => {
    const t = ev.touches;
    if (t.length === 2){ multi = true; swipe = null; start = {d:dist(t), z, x, y, mx:(t[0].clientX + t[1].clientX) / 2, my:(t[0].clientY + t[1].clientY) / 2}; }
    else if (t.length === 1){ multi = false; swipe = null; start = {sx:t[0].clientX, sy:t[0].clientY, x, y, at:Date.now()}; }
  }, {passive:true});
  area.addEventListener('touchmove', ev => {
    if (!start) return; const t = ev.touches;
    if (t.length === 2 && start.d){ ev.preventDefault(); z = Math.max(1, Math.min(5, start.z * dist(t) / start.d)); x = start.x + (t[0].clientX + t[1].clientX) / 2 - start.mx; y = start.y + (t[0].clientY + t[1].clientY) / 2 - start.my; apply(); return; }
    if (t.length !== 1 || start.sx == null || multi) return;
    const dx = t[0].clientX - start.sx, dy = t[0].clientY - start.sy;
    if (z > 1){ ev.preventDefault(); x = start.x + dx; y = start.y + dy; clamp(); apply(); return; }
    if (swipe == null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) swipe = Math.abs(dx) > Math.abs(dy);
    if (swipe){ ev.preventDefault(); const edge = (dx > 0 && vIdx === 0) || (dx < 0 && vIdx === vList.length - 1); x = edge ? dx * .3 : dx; w.style.transition = 'none'; w.style.transform = `translate(${x}px,0)`; w.style.opacity = String(1 - Math.min(.5, Math.abs(x) / area.clientWidth)); }
  }, {passive:false});
  area.addEventListener('touchend', ev => {
    if (ev.touches.length){ if (ev.touches.length === 1) start = {sx:ev.touches[0].clientX, sy:ev.touches[0].clientY, x, y, at:Date.now()}; return; }
    const ch = ev.changedTouches[0], dx = start?.sx != null ? ch.clientX - start.sx : 0, dy = start?.sy != null ? ch.clientY - start.sy : 0;
    if (swipe && z === 1){
      const fast = Math.abs(dx) / Math.max(1, Date.now() - start.at) > .5, dir = dx < 0 ? 1 : -1, ni = vIdx + dir;
      if ((Math.abs(dx) > area.clientWidth * .22 || (fast && Math.abs(dx) > 30)) && ni >= 0 && ni < vList.length){
        w.style.transition = 'transform .18s ease-in, opacity .18s'; w.style.transform = `translate(${-dir * area.clientWidth}px,0)`; w.style.opacity = '0';
        setTimeout(() => { vEnter = dir; vStep(dir); }, 170);
      } else { x = 0; w.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s'; w.style.transform = 'translate(0,0)'; w.style.opacity = '1'; }
      swipe = null; start = null; return;
    }
    if (z < 1.05){ z = 1; x = 0; y = 0; apply(true); } else { clamp(); apply(); }
    if (!multi && !isVideo && Math.abs(dx) < 10 && Math.abs(dy) < 10){   // double-tap
      const now = Date.now();
      if (now - lastTap < 300){ if (z > 1){ z = 1; x = 0; y = 0; } else { const r = area.getBoundingClientRect(); z = 2.5; x = (r.left + r.width / 2 - ch.clientX) * 1.5; y = (r.top + r.height / 2 - ch.clientY) * 1.5; clamp(); } apply(true); lastTap = 0; }
      else lastTap = now;
    }
    start = null;
  });
  area.addEventListener('wheel', ev => { if (!ev.ctrlKey) return; ev.preventDefault(); z = Math.max(1, Math.min(5, z * Math.exp(-ev.deltaY / 100))); if (z === 1){ x = 0; y = 0; } clamp(); apply(); }, {passive:false});
}

async function deleteAccount(){

async function deleteUserData(id, username){
  const q = (c, f, op, v) => F.getDocs(F.query(col(c), F.where(f, op, v)));
  const [ds, ns, ps, gs, es, r1, r2] = await Promise.all([q('deliveries', 'userId', '==', id), q('notifications', 'userId', '==', id), q('photos', 'matched', 'array-contains', id), q('groups', 'members', 'array-contains', id), q('events', 'members', 'array-contains', id), q('requests', 'toId', '==', id), q('requests', 'fromId', '==', id)]);
  const ops = [];
  ds.docs.concat(ns.docs, r1.docs, r2.docs).forEach(d => ops.push(b => b.delete(d.ref)));
  ps.docs.forEach(d => ops.push(b => b.update(d.ref, {faces:d.data().faces.map(f => f.matchId === id ? {...f, matchId:null} : f), matched:F.arrayRemove(id)})));
  gs.docs.concat(es.docs).forEach(d => ops.push(b => b.update(d.ref, {members:F.arrayRemove(id)})));
  if (username){ ops.push(b => b.delete(ref('usernames', username))); try { if ((await F.getDoc(ref('logins', username))).exists()) ops.push(b => b.delete(ref('logins', username))); } catch {} }
  ops.push(b => b.delete(ref('users', id)));
  await commitOps(ops);
}

    <div class="sechead">Appearance</div>
    <div class="seg" style="margin:0 0 4px">${[['auto', 'Automatic'], ['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => `<button class="${themeNow() === k ? 'on' : ''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div>
    <div class="fnote" style="margin:0 6px">Automatic follows your phone's setting.</div>
    <div style="height:24px"></div>
    <div class="list"><div class="cell"><div class="main">Logged In As</div><span class="val" style="max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(AUTH?.currentUser?.email || '')}</span></div>
      <a class="cell tap" href="terms.html" target="_blank" style="color:inherit;text-decoration:none"><div class="main">Terms & Privacy</div><span class="chev">›</span></a></div>
    <div style="height:24px"></div>
    ${AUTH?.currentUser?.providerData?.some(p => p.providerId === 'password') ? `<div class="list"><button class="cell tap" onclick="changePassword()"><div class="main">Change Password</div><span class="chev">›</span></button></div><div style="height:24px"></div>` : ''}
    <div class="list"><button class="cell tap blue" onclick="logOut()">Log Out</button>${isAdminId(ME) ? '' : `<button class="cell tap red" onclick="deleteAccount()">Delete Account</button>`}</div>
    <p class="hint" style="text-align:center;margin-top:20px;font-size:13px">InFrame · Prototype</p></div>`;
}
function render(){
  if (!F) return;
  document.body.classList.remove('hasnav');
  if (adminEntry && !adminAuthed()){ if (!$('#admingate')) $('#app').innerHTML = adminGate(); return; }
  if (!ME){
    if (AUTH?.currentUser){ if (!$('#signup')) renderSignup(); }   // signed in, finishing profile
    else if (!$('#auth')) renderAuth();                             // welcome / log in / sign up
    return;
  }
  if (!me()){ $('#app').innerHTML = '<div class="loading">Loading…</div>'; return; }
  let html = null;
  if (view.name === 'tab') html = ({inbox:screenInbox, photos:screenPhotos, groups:screenGroups, profile:screenProfile}[view.tab] || screenGroups)();
  else if (view.name === 'group') html = screenGroup();
  else if (view.name === 'event') html = screenEvent();
  else if (view.name === 'alerts') html = screenAlerts();
  else if (view.name === 'admin') html = screenAdmin();
  if (html == null){ if (dyn.photos && Date.now() - (view.at || 0) > 5000){ stack = []; view = {name:'tab', tab:'groups'}; html = screenGroups(); } else html = '<div class="loading">Loading…</div>'; }
  const asBar = adminAuthed() && ME !== adminProfileId() ?`<div class="asbar">Viewing as ${esc(handle(ME))}<button onclick="backToAdmin()">Back To Admin</button></div>` : '';
  $('#app').innerHTML = html + asBar + tabbar();
  document.body.classList.add('hasnav');
  if (document.querySelector('#viewer.show') && !vZoomed) drawViewer();
  if (standalone && !me()?.hasHomeApp && !markHasApp.done){ markHasApp.done = true; markHasApp(); }
  if (view.name === 'tab' && !$('#dim') && !whatsNew.done){ whatsNew.done = true; setTimeout(() => { if (!$('#dim')) whatsNew(); }, 900); }
  document.querySelectorAll('img[data-full]').forEach(async im => { const id = im.dataset.full; if (!id || fullCache.get(id) === im.src) return; const u = await getFull(id).catch(() => null); if (u && im.isConnected) im.src = u; });
}

/* ---------- start ---------- */
function start(){ stopAll(); stack = []; view = {name:'tab', tab:'groups'}; if (ME){ subscribeAll(); setTimeout(maybeJoin, 300); } else { su = {step:1, first:'', last:'', username:''}; } $('#app').innerHTML = ''; render(); }
(async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!FB_CONFIG){ $('#app').innerHTML = '<div class="empty" style="padding-top:30vh"><b>Almost Ready</b>The InFrame database is still being set up.</div>'; return; }
  try { await initFirebase(); } catch (e){ $('#app').innerHTML = '<div class="empty" style="padding-top:30vh"><b>Can\'t Connect</b>Check your internet connection and reopen InFrame.</div>'; return; }
  const p = new URLSearchParams(location.search);
  if (p.get('join')) sessionStorage.setItem('inframe_join', p.get('join'));
  if (p.get('reset')){ history.replaceState(null, '', location.pathname); setTimeout(() => { if (!ME){ showAuth('login'); toast('Password changed. Log in with your email and new password.'); } }, 600); }
  if (p.has('admin') && !adminAuthed()) adminEntry = true;
  if (p.toString()) history.replaceState(null, '', location.pathname);
  ['inframe_me', 'inframe_accounts', 'inframe_admin_return'].forEach(k => localStorage.removeItem(k)); // old device-only accounts
  booted = true;
  await routeAuth();
})();
</script>
